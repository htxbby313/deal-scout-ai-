name: Sync pnpm lockfile

on:
  push:
    branches: [main]
    paths:
      - 'personal-deal-scout/package.json'
      - 'personal-deal-scout/pnpm-lock.yaml'
      - '.github/workflows/sync-pnpm-lock.yml'

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: personal-deal-scout/pnpm-lock.yaml

      - name: Regenerate lockfile
        working-directory: personal-deal-scout
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add personal-deal-scout/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile is already synchronized.'
            exit 0
          fi
          git commit -m 'Sync pnpm lockfile with package manifest'
          git push
